# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_sample_qc_lists
description: Derive the sex mismatch, heterozygosity and KING relatedness reports and their decision lists of one PLINK fileset per stratum from stats-only plink2 runs on the filter chain's lists, over the marker set the stratum's mode selects; in study mode the stratum's own LD-pruned QC'd variants after the long-range LD and non-autosomal exclusion, in shared mode the reference-pruned markers of the ancestry route with the ancestry-matched reference samples as the heterozygosity baseline
keywords:
  - plink
  - quality control
  - linkage disequilibrium
  - sex check
  - heterozygosity
  - relatedness
components:
  - plink2/indeppairwise
  - highld_exclude
  - plink2/freq
  - plink2/het
  - plink2/checksex
  - sex_check_decisions
  - heterozygosity_plots
  - plink2/makekingtable
  - relatedness_decisions
input:
  - ch_genotypes:
      description: One PLINK 1 fileset per stratum with the filter chain's lists; extract is the keep-list, exclude the list of exclusion lists, remove the mind removal list and smiss the sample missingness report over the MAF-passing variants before the geno filter, the basis of the duplicate rule; meta.id must be unique across strata and meta.sample_qc_marker_set, `study` or `shared`, selects the stratum's marker set
      structure: [map meta, path bed, path bim, path fam, path extract, list exclude, path remove, path smiss]
      pattern: "*.{bed,bim,fam,snplist,txt,smiss}"
      ontologies: []
  - ch_reference:
      description: One item per stratum in shared mode; the shared marker list of the ancestry route (study-side IDs, harmonised, outside the long-range LD regions and off the sex chromosomes, filtered and pruned on the pooled or the ancestry-matched reference samples), the merged reference fileset of the same route, renamed to the stratum's IDs and flipped onto its strand, and the reference samples of the stratum's super-population as FID IID pairs for plink2 --keep; the join with the shared strata is strict
      structure: [map meta, path shared_markers, path pgen, path pvar, path psam, path reference_keep]
      pattern: "*.{prune.in,pgen,pvar,psam,txt}"
      ontologies: []
  - high_ld_regions:
      description: BED of long-range LD regions, 0-based half-open, bare chromosome codes
      structure: path high_ld_regions
  - ld_window_size:
      description: Window of --indep-pairwise, in variants
      structure: integer ld_window_size
  - ld_step_size:
      description: Step of --indep-pairwise, in variants
      structure: integer ld_step_size
  - ld_r2:
      description: r-squared threshold of --indep-pairwise
      structure: number ld_r2
  - relatedness_indiv_sd:
      description: Standard deviations above the cohort mean kinship at which an individual is an outlier
      structure: number relatedness_indiv_sd
  - relatedness_po_ibs0_max:
      description: IBS0 at or below which a first-degree pair is parent-offspring rather than full sibling
      structure: number relatedness_po_ibs0_max
output:
  - prune_in:
      type: file
      description: Variants retained by LD pruning of the QC'd set over every chromosome; one item per stratum in study mode
      structure: [map meta, path prune_in]
      pattern: "*.prune.in"
      ontologies: []
  - prune_out:
      type: file
      description: Variants removed by LD pruning; one item per stratum in study mode
      structure: [map meta, path prune_out]
      pattern: "*.prune.out"
      ontologies: []
  - highld_exclude:
      type: file
      description: Pruned variants inside a long-range LD region or off the autosomes, for plink2 --exclude; one item per stratum in study mode
      structure: [map meta, path highld_exclude]
      pattern: "*.highld_exclude.txt"
      ontologies: []
  - reference_afreq:
      type: file
      description: plink2 --freq table of the matched reference samples over the shared markers, the frequency basis of both heterozygosity reports; one item per stratum in shared mode
      structure: [map meta, path afreq]
      pattern: "*.afreq"
      ontologies: []
  - reference_het:
      type: file
      description: plink2 --het report of the matched reference samples over the shared markers and frequencies; one item per stratum in shared mode
      structure: [map meta, path reference_het]
      pattern: "*.het"
      ontologies: []
  - sexcheck:
      type: file
      description: plink2 --check-sex report after the PAR split, over the pruned set in study mode and over every QC-passing variant in shared mode
      structure: [map meta, path sexcheck]
      pattern: "*.sexcheck"
      ontologies: []
  - sex_mismatch:
      type: file
      description: The PROBLEM rows of the sex check, header only when there is none
      structure: [map meta, path sex_mismatch]
      pattern: "*.sex_mismatch.tsv"
      ontologies: []
  - sex_remove:
      type: file
      description: Sex mismatches as FID IID pairs for plink2 --remove
      structure: [map meta, path sex_remove]
      pattern: "*.sex_mismatch_remove.txt"
      ontologies: []
  - sex_check_hist_plot:
      type: file
      description: Histogram of the chromosome X F by recorded sex, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.sex_check_hist.{pdf,png}"
      ontologies: []
  - het:
      type: file
      description: plink2 --het report of the study over the autosomal marker set of its mode, against the matched reference frequencies in shared mode
      structure: [map meta, path het]
      pattern: "*.het"
      ontologies: []
  - het_hist:
      type: file
      description: Counts of samples per source in 100 bins of the heterozygosity F, the study rows and, in shared mode, the reference rows over the same bins
      structure: [map meta, path hist_data]
      pattern: "*.het_hist.tsv"
      ontologies: []
  - het_sex_scatter:
      type: file
      description: Per-sample heterozygosity F and sex-check F, joined on the sample IDs
      structure: [map meta, path scatter_data]
      pattern: "*.het_sex_scatter.tsv"
      ontologies: []
  - het_hist_plot:
      type: file
      description: Histogram of the heterozygosity F, the reference distribution beneath the study's in shared mode, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.het_hist.{pdf,png}"
      ontologies: []
  - het_sex_scatter_plot:
      type: file
      description: Scatter of the heterozygosity F against the sex-check F, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.het_sex_scatter.{pdf,png}"
      ontologies: []
  - kin0:
      type: file
      description: plink2 --make-king-table report over the same autosomal marker set, restricted by the kinship filter configured on PLINK2_MAKEKINGTABLE
      structure: [map meta, path kin0]
      pattern: "*.kin0"
      ontologies: []
  - relatedness_pairs:
      type: file
      description: The kinship report with the degree and relationship of every pair
      structure: [map meta, path pairs]
      pattern: "*.relatedness_pairs.tsv"
      ontologies: []
  - relatedness_indiv:
      type: file
      description: Per-sample mean kinship over every other sample, read from the KING matrix of the same pass, with the outlier flag
      structure: [map meta, path indiv]
      pattern: "*.relatedness_indiv.tsv"
      ontologies: []
  - relatedness_remove:
      type: file
      description: One member of every duplicate/MZ pair, the one with the higher missing-call rate, for plink2 --remove
      structure: [map meta, path relatedness_remove]
      pattern: "*.relatedness_remove.txt"
      ontologies: []
  - relatedness_outliers:
      type: file
      description: Mean-kinship outliers as FID IID pairs; published, not applied
      structure: [map meta, path outliers]
      pattern: "*.relatedness_outliers.txt"
      ontologies: []
  - relatedness_hist_plot:
      type: file
      description: Histogram of the reported kinship coefficients, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.relatedness_hist.{pdf,png}"
      ontologies: []
  - relatedness_indiv_hist_plot:
      type: file
      description: Histogram of the per-sample mean kinship, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.relatedness_indiv_hist.{pdf,png}"
      ontologies: []
authors:
