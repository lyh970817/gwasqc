# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_qc_filter_lists
description: Derive the exclusion list of the variants on non-standard contigs, the MAF keep-list over the standard chromosomes, the geno and mind missingness decision lists in the legacy order with the call-rate ladder, and the Hardy-Weinberg exclusion list of one PLINK fileset per stratum from stats-only plink2 runs
keywords:
  - plink
  - quality control
  - missingness
  - hardy-weinberg
  - minor allele frequency
components:
  - contig_exclude
  - plink2/writesnplist
  - plink2/missing
  - geno_decisions
  - mind_decisions
  - missingness_ladder
  - missingness_plots
  - plink2/hardy
  - hwe_decisions
  - hwe_plots
input:
  - ch_genotypes:
      description: One PLINK 1 fileset per stratum; meta.id must be unique across strata
      structure: [map meta, path bed, path bim, path fam]
      pattern: "*.{bed,bim,fam}"
      ontologies: []
  - geno:
      description: Variants whose missing-call rate exceeds this value are listed for exclusion
      structure: number geno
  - mind:
      description: Samples whose missing-call rate exceeds this value are listed for removal
      structure: number mind
  - hwe:
      description: Variants whose Hardy-Weinberg exact-test p-value is below this value are listed for exclusion
      structure: number hwe
output:
  - contig_exclude:
      type: file
      description: Variants whose chromosome code is not one of 1-22, X, Y, XY and MT, such as alt and random contigs, one ID per line; applied under --exclude to the MAF run, so that the MAF keep-list and everything extracted from it carry the standard chromosomes only
      structure: [map meta, path contig_exclude]
      pattern: "*.contig_exclude.txt"
      ontologies: []
  - maf_snplist:
      type: file
      description: Variants on the standard chromosomes passing the MAF threshold configured on PLINK2_WRITESNPLIST through ext.args, one ID per line
      structure: [map meta, path snplist]
      pattern: "*.snplist"
      ontologies: []
  - vmiss:
      type: file
      description: plink2 variant-based missingness report over the MAF-passing variants
      structure: [map meta, path vmiss]
      pattern: "*.vmiss"
      ontologies: []
  - smiss:
      type: file
      description: plink2 sample-based missingness report over the MAF-passing variants that survive the geno threshold, as the legacy chain measured it
      structure: [map meta, path smiss]
      pattern: "*.smiss"
      ontologies: []
  - smiss_maf:
      type: file
      description: plink2 sample-based missingness report over every MAF-passing variant, before the geno threshold, from the same run as the variant report; the legacy `_maf<maf>_check.imiss` that the duplicate rule compares
      structure: [map meta, path smiss]
      pattern: "*.smiss"
      ontologies: []
  - geno_exclude:
      type: file
      description: Variants exceeding the geno threshold, one ID per line for plink2 --exclude
      structure: [map meta, path geno_exclude]
      pattern: "*.geno_exclude.txt"
      ontologies: []
  - mind_remove:
      type: file
      description: Samples exceeding the mind threshold over the geno-retained variants, one FID IID pair per line for plink2 --remove
      structure: [map meta, path mind_remove]
      pattern: "*.mind_remove.txt"
      ontologies: []
  - missingness_ladder:
      type: file
      description: Call-rate ladder from 90 to 99 percent, one row per rate applied from the base fileset with geno before mind, from one --missing run per rung
      structure: [map meta, path ladder]
      pattern: "*.missingness_ladder.tsv"
      ontologies: []
  - hardy:
      type: file
      description: plink2 autosomal Hardy-Weinberg report over the MAF-, geno- and mind-filtered set
      structure: [map meta, path hardy]
      pattern: "*.hardy"
      ontologies: []
  - hardy_x:
      type: file
      description: plink2 chromosome X Hardy-Weinberg report, emitted only for filesets that carry chromosome X
      structure: [map meta, path hardy_x]
      optional: true
      pattern: "*.hardy.x"
      ontologies: []
  - hwe_exclude:
      type: file
      description: Variants below the HWE p-value threshold, one ID per line for plink2 --exclude
      structure: [map meta, path hwe_exclude]
      pattern: "*.hwe_exclude.txt"
      ontologies: []
  - vmiss_hist_data:
      type: file
      description: Histogram counts of the per-variant missing-call rate over the MAF-passing variants, the data behind the plot
      structure: [map meta, path vmiss_hist]
      pattern: "*.vmiss_hist.tsv"
      ontologies: []
  - vmiss_hist_plot:
      type: file
      description: The per-variant missingness histogram with the geno threshold marked, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.vmiss_hist.{pdf,png}"
      ontologies: []
  - smiss_hist_data:
      type: file
      description: Histogram counts of the per-sample missing-call rate over the geno-retained variants, the data behind the plot
      structure: [map meta, path smiss_hist]
      pattern: "*.smiss_hist.tsv"
      ontologies: []
  - smiss_hist_plot:
      type: file
      description: The per-sample missingness histogram with the mind threshold marked, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.smiss_hist.{pdf,png}"
      ontologies: []
  - ladder_plot:
      type: file
      description: The call-rate ladder rendered as a table image, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.missingness_ladder.{pdf,png}"
      ontologies: []
  - hwe_hist_data:
      type: file
      description: Histogram counts of the Hardy-Weinberg p-value per report, the data behind the plot
      structure: [map meta, path hwe_hist]
      pattern: "*.hwe_hist.tsv"
      ontologies: []
  - hwe_hist_plot:
      type: file
      description: The Hardy-Weinberg p-value histogram over every variant, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.hwe_hist.{pdf,png}"
      ontologies: []
  - hwe_window_data:
      type: file
      description: Histogram counts of the log10 p-value within the window 1e-20 < P < 0.01 per report, the data behind the plot
      structure: [map meta, path hwe_hist_window]
      pattern: "*.hwe_hist_window.tsv"
      ontologies: []
  - hwe_window_plot:
      type: file
      description: The windowed Hardy-Weinberg histogram with the threshold marked, as PDF and PNG
      structure: [map meta, path pdf, path png]
      pattern: "*.hwe_hist_window.{pdf,png}"
      ontologies: []
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
