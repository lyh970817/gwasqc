name: sex_check_decisions
description: Table the sex mismatches of one stratum from a plink2 --check-sex report, list them for removal and draw the chromosome X F histogram by recorded sex
keywords:
  - sex check
  - genotype
  - quality control
  - plot
tools:
  - r-base:
      description: The R programming language runtime
      homepage: https://www.r-project.org/
      documentation: https://cran.r-project.org/manuals.html
  - r-ggplot2:
      description: Grammar-of-graphics plotting for R
      homepage: https://ggplot2.tidyverse.org/
      documentation: https://ggplot2.tidyverse.org/reference/
  - r-data.table:
      description: Fast tabular data handling for R
      homepage: https://r-datatable.com/
      documentation: https://rdatatable.gitlab.io/data.table/
input:
  - - meta:
        type: map
        description: |
          Groovy map describing the stratum.
          Expected keys:
            - id (string): Stratum identifier, used as the output prefix.
    - sexcheck:
        type: file
        description: plink2 --check-sex report with PEDSEX, STATUS and F columns, optionally FID, YCOUNT and YRATE
        pattern: "*.sexcheck"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  mismatch:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "${prefix}.sex_mismatch.tsv":
          type: file
          description: The PROBLEM rows of the report with the report's columns; header only when there is none
          pattern: "*.sex_mismatch.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  sample_remove:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "${prefix}.sex_mismatch_remove.txt":
          type: file
          description: One space-separated FID IID pair, or bare IID, per PROBLEM row for plink2 --remove; empty when there is none
          pattern: "*.sex_mismatch_remove.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  hist_data:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "${prefix}.sex_check_hist.tsv":
          type: file
          description: Counts of samples per recorded sex in 100 bins of F spanning the observed range; the data the histogram is drawn from
          pattern: "*.sex_check_hist.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  hist_plot:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "${prefix}.sex_check_hist.pdf":
          type: file
          description: Histogram of F by recorded sex; a second page is zoomed to a count of 20
          pattern: "*.sex_check_hist.pdf"
          ontologies:
            - edam: "http://edamontology.org/format_3508" # PDF
      - "${prefix}.sex_check_hist.png":
          type: file
          description: The full-range histogram as an image
          pattern: "*.sex_check_hist.png"
          ontologies:
            - edam: "http://edamontology.org/format_3603" # PNG
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions, written by the R template because an eval output is only accepted for a Bash script
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
