name: missingness_ladder
description: Assemble the cumulative legacy call-rate ladder of one stratum, a variant and a sample step per rung, from the cumulative exclusion and removal lists of its rungs
keywords:
  - missingness
  - call rate
  - genotype
  - quality control
tools:
  - r-base:
      description: The R programming language runtime; the script uses base R only
      homepage: https://www.r-project.org/
      documentation: https://cran.r-project.org/manuals.html
input:
  - - meta:
        type: map
        description: |
          Groovy map describing the stratum.
          Expected keys:
            - id (string): Stratum identifier, used as the output prefix.
    - maf_snplist:
        type: file
        description: The MAF keep-list the ladder starts from, one variant ID per line; its line count is the variant count before the first rung
        pattern: "*.snplist"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Text
    - fam:
        type: file
        description: The stratum's sample table; its line count is the sample count before the first rung
        pattern: "*.fam"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Text
    - call_rates:
        type: list
        description: Call rates in percent, one per rung of the cumulative ladder, aligned with geno_excludes and mind_removes; a rung's missing-call threshold is 1 minus its call rate
    - geno_excludes:
        type: file
        description: One cumulative variant exclusion list per rung, every earlier rung's exclusions included, aligned with call_rates and named distinctly
        pattern: "*.geno_exclude.txt"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Text
    - mind_removes:
        type: file
        description: One cumulative sample removal list per rung, every earlier rung's removals included, aligned with call_rates and named distinctly
        pattern: "*.mind_remove.txt"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Text
output:
  ladder:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "${prefix}.missingness_ladder.tsv":
          type: file
          description: Two rows per rung in call-rate order, the variant step and then the sample step, with the columns step (the legacy Sample/SNP label, 90, 90/90, 90/91, 91/91, ...), call_rate, filter (geno or mind), missing_threshold, variants_removed, variants_remaining, samples_removed and samples_remaining; each step applied to what the previous step left
          pattern: "*.missingness_ladder.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions, written by the R template because an eval output is only accepted for a Bash script
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
