name: mind_decisions
description: List the samples of one stratum whose missing-call rate exceeds the mind threshold, from a plink2 --missing sample report
keywords:
  - missingness
  - call rate
  - genotype
  - quality control
tools:
  - r-base:
      description: The R programming language runtime; the decision script uses base R only
      homepage: https://www.r-project.org/
      documentation: https://cran.r-project.org/manuals.html
input:
  - - meta:
        type: map
        description: |
          Groovy map describing the stratum.
          Expected keys:
            - id (string): Stratum identifier, used as the output prefix.
    - smiss:
        type: file
        description: plink2 sample-based missing-genotype report with an IID, optionally an FID, and an F_MISS column
        pattern: "*.smiss"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - mind:
        type: float
        description: Samples whose missing-call rate exceeds this value are listed for removal; tuple-local so that one stratum can be listed at several thresholds
    - carried_remove:
        type: file
        description: Optional removal list of the previous rung of the call-rate ladder, in the output's format, whose samples the report was computed without; written first, unchanged, so that the output is the ladder's cumulative removal list. Pass [] when there is none
        pattern: "*.mind_remove.txt"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Text
output:
  sample_remove:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "${prefix}.mind_remove.txt":
          type: file
          description: One space-separated FID IID pair, or bare IID, per line for plink2 --remove, the carried list first; empty when nothing is carried and no sample exceeds the mind threshold
          pattern: "*.mind_remove.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions, written by the R template because an eval output is only accepted for a Bash script
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
