# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plink2_score"
description: Score the samples of a PLINK 1 or PLINK 2 fileset against a per-variant weight file with `--score`, optionally standardising with allele frequencies read from a `--read-freq` table, after any variant and sample filter lists are applied
keywords:
  - plink2
  - score
  - polygenic score
  - projection
  - genotype
tools:
  - "plink2":
      description: "Whole genome association analysis toolset designed for large-scale genetic analyses."
      homepage: "https://www.cog-genomics.org/plink/2.0/"
      documentation: "https://www.cog-genomics.org/plink/2.0/score"
      tool_dev_url: "https://github.com/chrchang/plink-ng"
      licence: ["GPL-3.0-or-later"]
      identifier: "biotools:plink"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing fileset metadata
          e.g. `[ id:'plink_simulated' ]`
    - plink_genotype_file:
        type: file
        description: PLINK 1 binary genotype table or PLINK 2 binary genotype table; the staged extension selects `--bfile` or `--pfile`, and the three fileset members must share one basename
        pattern: "*.{bed,pgen}"
        ontologies: []
    - plink_variant_file:
        type: file
        description: PLINK 1 extended MAP file or uncompressed PLINK 2 variant information file
        pattern: "*.{bim,pvar}"
        ontologies: []
    - plink_sample_file:
        type: file
        description: PLINK 1 sample information file or PLINK 2 sample information file
        pattern: "*.{fam,psam}"
        ontologies: []
    - extract:
        type: file
        description: Optional variant ID list file(s) passed to `--extract`; plink2 keeps the union of the listed variants; use `[]` when absent
        pattern: "*"
        ontologies: []
    - exclude:
        type: file
        description: Optional variant ID list file(s) passed to `--exclude`; plink2 drops the union of the listed variants; use `[]` when absent
        pattern: "*"
        ontologies: []
    - keep:
        type: file
        description: Optional sample ID list file(s) passed to `--keep`; plink2 keeps the union of the listed samples; use `[]` when absent
        pattern: "*"
        ontologies: []
    - remove:
        type: file
        description: Optional sample ID list file(s) passed to `--remove`; plink2 drops the union of the listed samples; use `[]` when absent
        pattern: "*"
        ontologies: []
    - score_file:
        type: file
        description: Weight file passed to `--score`, one variant per line with an ID column, an allele column and one or more weight columns; the column numbers and modifiers that follow the file name, such as `2 5 header-read no-mean-imputation variance-standardize list-variants` for a plink2 `--pca allele-wts` file written with `vcols=chrom,ref,alt`, travel through `ext.args2`, and `--score-col-nums` through `ext.args`; an entry whose allele does not match the variant's alleles is skipped with a warning
        pattern: "*"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - read_freq:
        type: file
        description: Optional plink2 `--freq` or `--freq counts` table passed to `--read-freq`, so that mean imputation and variance standardisation use these allele frequencies rather than those of the scored samples; a variant absent from the table falls back to the scored samples' frequencies without an error; use `[]` when absent
        pattern: "*.{afreq,acount}"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  sscore:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.sscore":
          type: file
          description: Per-sample scores, one column per selected weight column named after the score-file header with an `_AVG` suffix by default
          pattern: "*.sscore"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  variants:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.sscore.vars":
          type: file
          optional: true
          description: The variant IDs that were actually scored, one per line; written only when the `list-variants` modifier is given
          pattern: "*.sscore.vars"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  log:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.log":
          type: file
          description: PLINK 2 run log
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  versions_plink2:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "plink2":
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - plink2:
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
authors:
  - "@lyh970817"
maintainers:
