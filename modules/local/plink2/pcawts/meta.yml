# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plink2_pcawts"
description: Compute the top principal components of a PLINK 1 or PLINK 2 fileset with `--pca allele-wts` and write the per-allele weights, together with the allele counts of the same variant set, so that other samples can be projected onto the components with `--score` and `--read-freq`
keywords:
  - plink2
  - pca
  - principal components
  - allele weights
  - projection
  - genotype
tools:
  - "plink2":
      description: "Whole genome association analysis toolset designed for large-scale genetic analyses."
      homepage: "https://www.cog-genomics.org/plink/2.0/"
      documentation: "https://www.cog-genomics.org/plink/2.0/strat#pca"
      tool_dev_url: "https://github.com/chrchang/plink-ng"
      licence: ["GPL-3.0-or-later"]
      identifier: "biotools:plink"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing fileset metadata
          e.g. `[ id:'plink_simulated' ]`
    - plink_genotype_file:
        type: file
        description: PLINK 1 binary genotype table or PLINK 2 binary genotype table; the staged extension selects `--bfile` or `--pfile`, and the three fileset members must share one basename
        pattern: "*.{bed,pgen}"
        ontologies: []
    - plink_variant_file:
        type: file
        description: PLINK 1 extended MAP file or uncompressed PLINK 2 variant information file
        pattern: "*.{bim,pvar}"
        ontologies: []
    - plink_sample_file:
        type: file
        description: PLINK 1 sample information file or PLINK 2 sample information file
        pattern: "*.{fam,psam}"
        ontologies: []
    - extract:
        type: file
        description: Optional variant ID list file(s) passed to `--extract`; plink2 keeps the union of the listed variants; use `[]` when absent
        pattern: "*"
        ontologies: []
    - exclude:
        type: file
        description: Optional variant ID list file(s) passed to `--exclude`; plink2 drops the union of the listed variants; use `[]` when absent
        pattern: "*"
        ontologies: []
    - keep:
        type: file
        description: Optional sample ID list file(s) passed to `--keep`; plink2 keeps the union of the listed samples; use `[]` when absent
        pattern: "*"
        ontologies: []
    - remove:
        type: file
        description: Optional sample ID list file(s) passed to `--remove`; plink2 drops the union of the listed samples; use `[]` when absent
        pattern: "*"
        ontologies: []
  - n_pcs:
      type: integer
      description: Number of principal components to compute; it fixes the number of weight columns of the allele-weight file that a `--score` projection must address, so it is part of the contract rather than an optional argument
output:
  allele_weights:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.eigenvec.allele":
          type: file
          description: Per-allele weights of every component, two rows per variant, with a header; the variant columns are selected by `--pca` `vcols=` modifiers given through `ext.args2`, and by default the ID is column 2, the weighted allele A1 column 6 and the weights start at column 7, or column 5 and 6 with `vcols=chrom,ref,alt`
          pattern: "*.eigenvec.allele"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  eigenvec:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.eigenvec":
          type: file
          description: Sample principal component coordinates
          pattern: "*.eigenvec"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  eigenval:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.eigenval":
          type: file
          description: One eigenvalue per line, in component order
          pattern: "*.eigenval"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  acount:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.acount":
          type: file
          description: plink2 `--freq counts` allele-count table over exactly the variants the components were computed from, for `--read-freq` in a `--score` projection
          pattern: "*.acount"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  log:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.log":
          type: file
          description: PLINK 2 run log
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  versions_plink2:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "plink2":
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - plink2:
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
