# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plink2_freq"
description: Report the allele frequencies, or the allele counts, of every variant of a PLINK 1 or PLINK 2 fileset after any variant and sample filter lists are applied, in the table that plink2 --read-freq consumes
keywords:
  - plink2
  - allele frequency
  - allele count
  - genotype
  - quality control
tools:
  - "plink2":
      description: "Whole genome association analysis toolset designed for large-scale genetic analyses."
      homepage: "https://www.cog-genomics.org/plink/2.0/"
      documentation: "https://www.cog-genomics.org/plink/2.0/basic_stats#freq"
      tool_dev_url: "https://github.com/chrchang/plink-ng"
      licence: ["GPL-3.0-or-later"]
      identifier: "biotools:plink"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing fileset metadata
          e.g. `[ id:'plink_simulated' ]`
    - plink_genotype_file:
        type: file
        description: PLINK 1 binary genotype table or PLINK 2 binary genotype table; the staged extension selects `--bfile` or `--pfile`, and the three fileset members must share one basename
        pattern: "*.{bed,pgen}"
        ontologies: []
    - plink_variant_file:
        type: file
        description: PLINK 1 extended MAP file or uncompressed PLINK 2 variant information file
        pattern: "*.{bim,pvar}"
        ontologies: []
    - plink_sample_file:
        type: file
        description: PLINK 1 sample information file or PLINK 2 sample information file
        pattern: "*.{fam,psam}"
        ontologies: []
    - extract:
        type: file
        description: Optional variant ID list file(s) passed to `--extract`; plink2 keeps the union of the listed variants; use `[]` when absent
        pattern: "*"
        ontologies: []
    - exclude:
        type: file
        description: Optional variant ID list file(s) passed to `--exclude`; plink2 drops the union of the listed variants; use `[]` when absent
        pattern: "*"
        ontologies: []
    - keep:
        type: file
        description: Optional sample ID list file(s) passed to `--keep`; plink2 keeps the union of the listed samples, so the frequencies are those of the kept samples alone; use `[]` when absent
        pattern: "*"
        ontologies: []
    - remove:
        type: file
        description: Optional sample ID list file(s) passed to `--remove`; plink2 drops the union of the listed samples; use `[]` when absent
        pattern: "*"
        ontologies: []
output:
  afreq:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.afreq":
          type: file
          optional: true
          description: Allele frequency report over the filtered samples and variants, one line per variant with the ALT allele frequency and the observation count; written under the default modifiers and absent when the `counts` modifier is supplied through `ext.args2`, so a caller joins on the channel its modifier produces. Either table is what plink2 `--read-freq` consumes
          pattern: "*.afreq"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  acount:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.acount":
          type: file
          optional: true
          description: Allele count report over the filtered samples and variants, one line per variant with the ALT allele count and the observation count; written instead of the frequency report when the `counts` modifier is supplied through `ext.args2`
          pattern: "*.acount"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  log:
    - - meta:
          type: map
          description: |
            Groovy map containing fileset metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.log":
          type: file
          description: PLINK 2 run log
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  versions_plink2:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "plink2":
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - plink2:
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
authors:
