repository_type: pipeline

nf_core_version: 4.0.3

lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    # The single module config is split into per-method-family files under `conf/modules/`, so that a new QC
    # stage adds a file instead of editing a shared one. Both this `files_exist` entry and the
    # `modules_config` toggle below are required: the first stops lint demanding the deleted file, the second
    # stops the `withName:` check reading it.
    - conf/modules.config
  modules_config: false
  nextflow_config:
    # The default long-range LD asset lives in the pipeline and is addressed through `${projectDir}`, which
    # the schema cannot resolve; the schema records the same expression for documentation.
    - config_defaults:
        - params.high_ld_regions

template:
  org: nf-core
  name: gwasqc
  description: A pipeline for genotype array quality control
  author: Yuhao Lin
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
  is_nfcore: true
